:root{

}

  --l1:#E07A6A; --l1lt:#4F2A24; --l2:#D79380; --l2lt:#4A2E27;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:16px;line-height:1.6}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 40px;

.m{border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone;background-repeat:no-repeat;
  transition:background-size .6s ease,box-shadow .35s ease,color .4s ease}

.s1{--c:var(--s1);--clt:var(--s1lt)} .s2{--c:var(--s2);--clt:var(--s2lt)} .s3{--c:var(--s3);--clt:var(--s3lt)} .sa{--c:var(--lv);--clt:var(--lvlt)}

.m.line{box-shadow:0 0 0 2.5px var(--c);color:var(--c);font-weight:700;padding:0 2px}
.tag.st{background:var(--c)}
ol.steps li.done .sn,ol.steps li.cur .sn{background:var(--c);color:#fff}
ol.steps li.cur .ti,ol.steps li.done .ti{color:var(--c)}
.steps .sw{display:inline-block;width:22px;height:12px;border-radius:3px;margin-left:8px;vertical-align:1px;background:var(--clt);box-shadow:inset 0 0 0 2px var(--c)}

.side{display:flex;flex-direction:column;gap:12px;min-width:0}

&lt;script&gt;
// ---------- 課文 ----------
const T = {
  ttl:&quot;為生命找出口&quot;,
  a1:&quot;朋友回香港時，我祝他一路順風。他笑了起來，打趣我：「你錯了，應該是『一路逆風』。」見我一臉驚訝，他接著說：「從前古人坐船旅行，自然是順風而行；現代人乘飛機，飛機起降時需要逆風而進，才能飛得又平又穩呢！」原來如此，可憐我這個一向就不了解科學知識的腦袋。&quot;,
  a2:&quot;我曾聽說，老鷹總是喜歡築巢於峭壁之上。峭壁上，草木不生，風厲如刀，母鷹就在那種環境訓練牠的小鷹飛行。在人的眼裡看來，母鷹似乎不太憐惜牠的孩子，然而，母鷹知道，只有最困難的環境，最嚴格的訓練，才能使牠的孩子在物競天擇的自然界，保持一個永遠不敗的地位。&quot;,
  a3:&quot;小鷹剛剛會站，母鷹便帶著牠們頂著氣流，抗著強風，一次一次的練習著。強大的阻力將把牠們的雙翅訓練得結實有力，足以幫助牠們飛得更高，飛得更遠，同時也磨練出牠們強健的體格，可以生存在最酷熱的沙漠，也能處於最寒冷的高山。在動物中，牠們是少見的強者。&quot;,
  a4:&quot;我思索著人不也應如此嗎？順境往往使我們好逸惡勞，只有在逆境中，才能磨練出我們堅強的意志，奮勇向上的力量。&quot;,
  b1:&quot;我的書桌上有一座彎月型的燈。這兩天，來了一位新鄰居，一隻小蜘蛛在上面結網。&quot;,
  b2:&quot;小蜘蛛只比大頭針的頂端大那麼一點點，模樣可愛極了！一面小小的網脈絡分明，小巧精緻，只可惜蜘蛛網過於脆弱，一不小心就破了。一陣風、一個噴嚏就把牠的網給吹跑了，反正也不知究竟破了多少回，但小蜘蛛一點兒也不介意呢！織了又破，破了又織，整天就看見牠在我的燈架上上下下的忙碌著，使得一家人都關心、憐惜起牠來。朋友上門，也趕快請來欣賞：「你看，我們的小蜘蛛在織網呢！」&quot;,
  b3:&quot;昨晚燈下，我和父親兩人聚精會神，興味盎然的看著小蜘蛛織網。一開始，牠像是個藝高膽大的高空飛人，用絲索把自己從燈架的上端一次次盪下來，固定好四周的經度線。接著，又變成長跑健將，繞著架好的經度線一圈圈向內跑，幾次看牠放緩腳步，以為牠跑不動了，不由暗暗為牠發急，但牠仍然堅持下去，直至整面網都織好。看牠精疲力盡一動也不能動的樣子，真比跑了馬拉松還累呢！&quot;,
  b4:&quot;望著這面小小的蛛網，我在想，我們是否也學到一些什麼呢？&quot;,
};
const LBL = k =&gt; k===&quot;ttl&quot; ? &quot;課名&quot; : (k[0]===&quot;a&quot; ? &quot;一路逆風&quot; : &quot;小蜘蛛&quot;) + &quot;\n第&quot; + &quot;〇一二三四&quot;[+k.slice(1)] + &quot;段&quot;;

const LV = {

const Q = [
 {art:&quot;一路逆風&quot;, n:1, lv:1, short:&quot;飛機在什麼環境下推進？&quot;, ref:&quot;〈一路逆風〉第一段&quot;, items:[&quot;a1&quot;],

  steps:[

   {ti:&quot;串成句子&quot;, say:&quot;結果呢？把環境和結果串成一句。&quot;, mk:[[&quot;a1&quot;,&quot;才能飛得又平又穩&quot;,&quot;hit&quot;,&quot;結果&quot;]]},
  ],
  ans:`&lt;div class=&quot;ab&quot;&gt;飛機在&lt;b&gt;逆風&lt;/b&gt;中推進，才能&lt;b&gt;飛得平穩&lt;/b&gt;。&lt;/div&gt;`},
 {art:&quot;一路逆風&quot;, n:2, lv:1, short:&quot;母鷹在哪裡訓練小鷹？&quot;, ref:&quot;〈一路逆風〉第二、三段&quot;, items:[&quot;a2&quot;,&quot;a3&quot;], long:true,
  q:&quot;母鷹在哪裡訓練小鷹飛行？結果如何？&quot;,
  steps:[
   {ti:&quot;圈關鍵詞&quot;, say:&quot;「在哪裡」和「結果如何」兩問，答案在不同段落。先找到母鷹訓練小鷹的句子。&quot;, mk:[[&quot;a2&quot;,&quot;母鷹就在那種環境訓練牠的小鷹飛行&quot;,&quot;box&quot;]]},
   {ti:&quot;回課文找&quot;, say:&quot;「那種環境」是哪裡？在那裡怎麼練？&quot;, mk:[[&quot;a2&quot;,&quot;築巢於峭壁之上&quot;,&quot;hit&quot;,&quot;在哪裡&quot;],[&quot;a3&quot;,&quot;頂著氣流，抗著強風&quot;,&quot;hit&quot;,&quot;怎麼練&quot;]]},
   {ti:&quot;串成句子&quot;, say:&quot;結果寫在第三段，找齊再串成一句。&quot;, mk:[[&quot;a3&quot;,&quot;雙翅訓練得結實有力&quot;,&quot;hit&quot;,&quot;結果&quot;],[&quot;a3&quot;,&quot;飛得更高，飛得更遠&quot;,&quot;hit&quot;]]},
  ],
  ans:`&lt;div class=&quot;ab&quot;&gt;母鷹在&lt;b&gt;峭壁上&lt;/b&gt;築巢，訓練小鷹頂著氣流，抗著強風練習飛行，讓牠的雙翅結實有力，&lt;b&gt;飛得更高更遠&lt;/b&gt;。&lt;/div&gt;`},
 {art:&quot;一路逆風&quot;, n:3, lv:1, short:&quot;順境和逆境各體悟到什麼？&quot;, ref:&quot;〈一路逆風〉第四段&quot;, items:[&quot;a4&quot;],
  q:&quot;作者在順境和逆境時分別體悟到什麼？&quot;,
  steps:[
   {ti:&quot;圈關鍵詞&quot;, say:&quot;圈出「順境」「逆境」──兩個都要分開回答。&quot;, mk:[[&quot;a4&quot;,&quot;順境&quot;,&quot;box&quot;],[&quot;a4&quot;,&quot;逆境&quot;,&quot;box&quot;]]},
   {ti:&quot;回課文找&quot;, say:&quot;順境會使我們怎麼樣？&quot;, mk:[[&quot;a4&quot;,&quot;往往使我們好逸惡勞&quot;,&quot;hit&quot;,&quot;順境&quot;]]},
   {ti:&quot;串成句子&quot;, say:&quot;逆境呢？兩個答案串在一起。&quot;, mk:[[&quot;a4&quot;,&quot;才能磨練出我們堅強的意志&quot;,&quot;hit&quot;,&quot;逆境&quot;]]},
  ],
  ans:`&lt;div class=&quot;alist&quot;&gt;&lt;div&gt;&lt;strong&gt;順境&lt;/strong&gt;會使我們好逸惡勞。&lt;/div&gt;&lt;div&gt;&lt;strong&gt;逆境&lt;/strong&gt;可以磨練堅強意志。&lt;/div&gt;&lt;/div&gt;`},
 {art:&quot;一路逆風&quot;, n:4, lv:4, short:&quot;為什麼把飛機和小鷹放在一起？&quot;, ref:&quot;〈一路逆風〉第一、三段&quot;, items:[&quot;a1&quot;,&quot;a3&quot;], long:true,
  q:&quot;從課文訊息想一想，作者為什麼會把「飛機飛行」和「小鷹學飛」放在一起？&quot;,
  steps:[

function markText(key, text, marks){
  // marks: [{sub, kind, label, fresh}]
  const spans = [];
  marks.forEach(m=&gt;{
    const i = text.indexOf(m.sub);
    if (i &lt; 0) return;
    if (spans.some(s =&gt; i &lt; s.e &amp;&amp; i + m.sub.length &gt; s.s)) return; // 避免重疊
    spans.push({s:i, e:i+m.sub.length, m});
  });
  spans.sort((a,b)=&gt;a.s-b.s);
  let out = &quot;&quot;, pos = 0;
  spans.forEach(({s,e,m})=&gt;{
    out += esc(text.slice(pos, s));
    const style = (m.kind===&quot;box&quot; || m.kind===&quot;tech&quot;) ? &quot;line&quot; : &quot;fill&quot;;
    out += `&lt;span class=&quot;m s${m.s} ${style}${m.fresh ? &quot; pre fresh&quot; : &quot;&quot;}&quot;&gt;${esc(text.slice(s,e))}&lt;/span&gt;`;
    if (m.label) out += `&lt;span class=&quot;tag st s${m.s}&quot;&gt;${m.label}&lt;/span&gt;`;
    pos = e;
  });
  return out + esc(text.slice(pos));
}

  $(&quot;qlv&quot;).textContent = `${q.lv}　${L.name}｜${L.kid}`;

  $(&quot;qref&quot;).textContent = &quot;回課文：&quot; + q.ref;
  // 已經按過「標出課文」的步驟才標記
  const byKey = {};
  SB.slice(0, Math.min(step, SB.length)).forEach((sb, j)=&gt;{
    if (sb.ph !== &quot;mark&quot;) return;
    (q.steps[sb.si].mk||[]).forEach(([key, sub, kind, label])=&gt;{
      (byKey[key] = byKey[key] || []).push({sub, kind, label, s: sb.si+1, fresh: j === step-1});
    });
  });
  $(&quot;passage&quot;).className = &quot;textcard&quot; + (q.long ? &quot; long&quot; : &quot;&quot;);
  $(&quot;passage&quot;).innerHTML = q.items.map(k=&gt;`&lt;div class=&quot;item${k[0]===&quot;h&quot;?&quot; h&quot;:&quot;&quot;}${k===&quot;title&quot;?&quot; title&quot;:&quot;&quot;}&quot;&gt;&lt;span class=&quot;lb&quot;&gt;${LBL(k)}&lt;/span&gt;&lt;div class=&quot;tx&quot;&gt;${markText(k, T[k], byKey[k]||[])}&lt;/div&gt;&lt;/div&gt;`).join(&quot;&quot;);
  requestAnimationFrame(()=&gt;requestAnimationFrame(()=&gt;document.querySelectorAll(&quot;#passage .m.pre&quot;).forEach(el=&gt;el.classList.remove(&quot;pre&quot;))));

// ---------- 逐段摘要 ----------
const $ = id =&gt; document.getElementById(id);
let cur = 0, step = 0;
function arr(x){ return Array.isArray(x) ? x : [x]; }

function buildChips(){
  $(&quot;chips&quot;).innerHTML = P.map((p,i)=&gt;`&lt;button class=&quot;chip&quot; type=&quot;button&quot; data-i=&quot;${i}&quot; aria-pressed=&quot;${i===cur}&quot;&gt;${p.art}　${p.cn}&lt;small&gt;${p.role}&lt;/small&gt;&lt;/button&gt;`).join(&quot;&quot;);
  $(&quot;chips&quot;).querySelectorAll(&quot;.chip&quot;).forEach(b=&gt;b.onclick=()=&gt;{cur=+b.dataset.i;step=0;render();});
}
// 每個摘要步驟拆兩下：先出題目，再按一下才標出課文和下面的提示
const psubs = p =&gt; p.steps.flatMap((st,si)=&gt;[{si, ph:&quot;ask&quot;}, {si, ph:&quot;show&quot;}]);
function render(){
  const p = P[cur], SB = psubs(p), total = SB.length + 1; // 最後一步：寫成一句
  document.querySelectorAll(&quot;#chips .chip&quot;).forEach((b,i)=&gt;b.setAttribute(&quot;aria-pressed&quot;, i===cur));
  $(&quot;pn&quot;).textContent = `〈${p.art}〉第${p.cn}段`;
  $(&quot;prole&quot;).textContent = p.role;
  $(&quot;pstrat&quot;).innerHTML = p.st.map(s=&gt;`&lt;span class=&quot;sp ${s}&quot;&gt;${s}&lt;/span&gt;`).join(&quot;&quot;);
  const state = {}, tags = {}, shown = new Set();
  SB.slice(0, Math.min(step, SB.length)).forEach((sb, j) =&gt; {
    if (sb.ph !== &quot;show&quot;) return;
    shown.add(sb.si);
    (p.steps[sb.si].do||[]).forEach(([kind, ids, label]) =&gt; {
      const list = arr(ids);
      list.forEach(id =&gt; state[id] = {kind, fresh: j === step-1});
      if (label) tags[list[list.length-1]] = {kind, label, fresh: j === step-1};
    });
  });
  const finalStep = step &gt;= total;
  $(&quot;passage&quot;).innerHTML = p.segs.map(([id, txt]) =&gt; {
    const s = state[id];
    let cls = &quot;s&quot;;
    if (s) cls += &quot; &quot; + s.kind + (s.fresh ? &quot; pre focus&quot; : &quot;&quot;);
    else if (finalStep) cls += &quot; dim&quot;;
    const tg = tags[id] ? `&lt;span class=&quot;tag ${tags[id].kind}&quot;&gt;${tags[id].kind===&quot;grp&quot; ? &quot;→ &quot; : &quot;&quot;}${tags[id].label}&lt;/span&gt;` : &quot;&quot;;
    return `&lt;span class=&quot;${cls}&quot; data-id=&quot;${id}&quot;&gt;${txt}&lt;/span&gt;${tg}`;
  }).join(&quot;&quot;);
  requestAnimationFrame(()=&gt;requestAnimationFrame(()=&gt;{
    document.querySelectorAll(&quot;#passage .s.pre&quot;).forEach(el=&gt;el.classList.remove(&quot;pre&quot;));
  }));
  const curSi = step === 0 ? -1 : step &gt; SB.length ? p.steps.length : SB[step-1].si;
  shown.add(p.steps.length);
    const all = p.steps.concat([{ti:&quot;寫成一句&quot;, say:&quot;把留下的重點用自己的話串成一句完整的話。&quot;}]);
  $(&quot;steps&quot;).innerHTML = all.map((st,i)=&gt;{
    const c = i &lt; curSi ? &quot;done&quot; : i === curSi ? &quot;cur&quot; : &quot;todo&quot;;
    const kinds = [...new Set((st.do||[]).map(d=&gt;d[0]))];
    const col = {topic:&quot;var(--gold)&quot;, key:&quot;var(--brick)&quot;, del:&quot;var(--strike)&quot;, grp:&quot;var(--sage)&quot;}[kinds[0]] || &quot;var(--deep2)&quot;;
    const sws = (c===&quot;todo&quot; || !shown.has(i)) ? &quot;&quot; : kinds.map(k=&gt;`&lt;span class=&quot;sw ${k}&quot;&gt;&lt;/span&gt;`).join(&quot;&quot;);
    const say = shown.has(i) ? st.say : &quot;先想一想，回課文找找看。&quot;;
    return `&lt;li class=&quot;${c}${shown.has(i) ? &quot;&quot; : &quot; asking&quot;}&quot; style=&quot;--c:${col}&quot;&gt;&lt;span class=&quot;no&quot;&gt;${i+1}&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;ti&quot;&gt;${c===&quot;todo&quot; ? &quot;　&quot; : st.ti}${sws}&lt;/div&gt;&lt;div class=&quot;say&quot;&gt;${say}&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;`;
  }).join(&quot;&quot;);
  $(&quot;sum&quot;).classList.toggle(&quot;wait&quot;, !finalStep);
  $(&quot;sumtx&quot;).textContent = finalStep ? p.sum : (step === 0 ? &quot;先讀一遍原文，想想這一段在講什麼。準備好就按「開始」。&quot; : &quot;還在找重點……&quot;);
  $(&quot;why&quot;).hidden = !finalStep;
  $(&quot;why&quot;).textContent = &quot;為什麼這樣摘：&quot; + p.why;
  $(&quot;prev&quot;).disabled = step === 0;
  $(&quot;next&quot;).disabled = finalStep;
  const nx = SB[step];

&lt;script&gt;
// ---------- 課文 ----------
const T = {
  ttl:&quot;最勇敢的女孩&quot;,
  p1:&quot;在巴基斯坦西北部一個小村落裡，住著一個名叫馬拉拉的女孩。生活在當地的女孩，大部分都沒有機會到學校接受正式的教育。馬拉拉很幸運，因為她的父親是一位詩人、校長和社會運動家，沒有當地輕視女性的觀念，所以她得以上學接受教育。馬拉拉在成長過程受到父親影響，對女孩子無法接受教育的情形也覺得不公平。&quot;,
  p2:&quot;西元二○○八年，馬拉拉十一歲的時候，恐怖組織霸占了她的家鄉，並宣布不准女孩上學，不讓婦女工作，還不許大家看電影、看電視、唱歌和跳舞。馬拉拉和父親都認為這樣的要求不合理，所以參加許多抗議活動並發表演講。二○○九年，馬拉拉在英國廣播公司的網站上，開始記錄被控制的生活，透過網路讓世界了解恐怖組織的暴行。&quot;,
  p3:&quot;二○一二年十月九日，一件不幸的事情發生了。有人擋下馬拉拉搭乘的校車，並對她開槍，馬拉拉的頭部嚴重受傷，生命垂危。事後，恐怖組織聲明這起攻擊事件是他們做的。一個為自己爭取受教權而發聲的女孩，竟然換來生命的威脅，這太不可思議了！這個事件引起全世界的關注，馬拉拉也被緊急送到英國救治，並幸運的存活下來。康復後的馬拉拉不但沒有放棄，反而更努力的為女孩爭取受教育的權利。&quot;,
  p4:&quot;二○一三年，馬拉拉受邀在聯合國大會上演講。她說：「恐怖分子認為他們的暴行能夠改變我的決心，但是對我來說，這些壓迫讓我失去的只是軟弱、害怕和無望，得到的則是堅強、勇氣和希望。」她還說：「讓我們拾起書本和筆，那是最強大的武器。一個孩子、一位老師、一本書和一枝筆，就可以改變這個世界。」這段話震撼了所有人，她也因此被稱為「全世界最勇敢的女孩」。她和父親成立了馬拉拉基金會，以實際的行動幫助窮困的女孩上學。二○一四年，十七歲的馬拉拉得到諾貝爾和平獎，是有史以來最年輕的得主。&quot;,
  p5:&quot;展現出無比勇氣的馬拉拉，用生命保衛女性受教育的權利，也讓人思索：什麼是「勇敢」？沒有恐懼，不害怕就是勇敢嗎？不知道害怕，有可能是無知造成的。馬拉拉縱使心中害怕，卻還是願意為信念前進。她心裡可能會因為險惡的環境和被槍擊的經驗而有所恐懼，但是心中有一個要為女孩爭取受教權的目標。因此，就算害怕，她也要站出來為沒機會學習的女孩發聲，這才是真正的勇敢。&quot;,
};

const Q = [
 {n:1, lv:1, short:&quot;馬拉拉住在哪裡？環境帶來什麼影響？&quot;, ref:&quot;第一段&quot;, items:[&quot;p1&quot;],

let cur = 0, step = 0;

function markText(key, text, marks){
  // marks: [{sub, kind, label, fresh}]
  const spans = [];
  marks.forEach(m=&gt;{
    const i = text.indexOf(m.sub);
    if (i &lt; 0) return;
    if (spans.some(s =&gt; i &lt; s.e &amp;&amp; i + m.sub.length &gt; s.s)) return; // 避免重疊
    spans.push({s:i, e:i+m.sub.length, m});
  });
  spans.sort((a,b)=&gt;a.s-b.s);
  let out = &quot;&quot;, pos = 0;
  spans.forEach(({s,e,m})=&gt;{
    out += esc(text.slice(pos, s));
    const style = (m.kind===&quot;box&quot; || m.kind===&quot;tech&quot;) ? &quot;line&quot; : &quot;fill&quot;;
    out += `&lt;span class=&quot;m s${m.s} ${style}${m.fresh ? &quot; pre fresh&quot; : &quot;&quot;}&quot;&gt;${esc(text.slice(s,e))}&lt;/span&gt;`;
    if (m.label) out += `&lt;span class=&quot;tag st s${m.s}&quot;&gt;${m.label}&lt;/span&gt;`;
    pos = e;
  });
  return out + esc(text.slice(pos));
}
// 每個步驟拆成兩下：先出「怎麼想」，有標記的再按一下才標出課文
const subs = q =&gt; q.steps.flatMap((st,si)=&gt; st.mk ? [{si, ph:&quot;ask&quot;}, {si, ph:&quot;mark&quot;}] : [{si, ph:&quot;ask&quot;}]);
function render(){
  const q = Q[cur], L = LV[q.lv], SB = subs(q), total = SB.length + 1;
  $(&quot;qwrap&quot;).className = &quot;col lv&quot; + q.lv;
  document.querySelectorAll(&quot;#qchips .qchip&quot;).forEach((b,i)=&gt;b.setAttribute(&quot;aria-pressed&quot;, i===cur));
  $(&quot;qn&quot;).textContent = &quot;提問 &quot; + q.n;
  $(&quot;qlv&quot;).textContent = `${q.lv}　${L.name}｜${L.kid}`;
  $(&quot;qt&quot;).textContent = q.q;
  $(&quot;qref&quot;).textContent = &quot;回課文：&quot; + q.ref;
  // 已經按過「標出課文」的步驟才標記
  const byKey = {};
  SB.slice(0, Math.min(step, SB.length)).forEach((sb, j)=&gt;{
    if (sb.ph !== &quot;mark&quot;) return;
    (q.steps[sb.si].mk||[]).forEach(([key, sub, kind, label])=&gt;{
      (byKey[key] = byKey[key] || []).push({sub, kind, label, s: sb.si+1, fresh: j === step-1});
    });
  });
  $(&quot;passage&quot;).className = &quot;textcard&quot; + (q.long ? &quot; long&quot; : &quot;&quot;);
  $(&quot;passage&quot;).innerHTML = q.items.map(k=&gt;`&lt;div class=&quot;item${k[0]===&quot;h&quot;?&quot; h&quot;:&quot;&quot;}${k===&quot;title&quot;?&quot; title&quot;:&quot;&quot;}&quot;&gt;&lt;span class=&quot;lb&quot;&gt;${LBL(k)}&lt;/span&gt;&lt;div class=&quot;tx&quot;&gt;${markText(k, T[k], byKey[k]||[])}&lt;/div&gt;&lt;/div&gt;`).join(&quot;&quot;);
  requestAnimationFrame(()=&gt;requestAnimationFrame(()=&gt;document.querySelectorAll(&quot;#passage .m.pre&quot;).forEach(el=&gt;el.classList.remove(&quot;pre&quot;))));
  const curSi = step === 0 ? -1 : step &gt; SB.length ? q.steps.length : SB[step-1].si;
  const marked = new Set(SB.slice(0, Math.min(step, SB.length)).filter(x=&gt;x.ph===&quot;mark&quot;).map(x=&gt;x.si));
  const all = q.steps.concat([{ti:&quot;看參考答案&quot;, say:&quot;說說看你的答案，再對照參考答案。&quot;}]);
  $(&quot;steps&quot;).innerHTML = all.map((st,i)=&gt;{
    const c = i &lt; curSi ? &quot;done&quot; : i === curSi ? &quot;cur&quot; : &quot;todo&quot;;
    const sc = i &lt; q.steps.length ? &quot;s&quot;+(i+1) : &quot;sa&quot;;
    const sw = (marked.has(i) &amp;&amp; st.mk) ? &#x27;&lt;span class=&quot;sw&quot;&gt;&lt;/span&gt;&#x27; : &quot;&quot;;
    return `&lt;li class=&quot;${c} ${sc}&quot;&gt;&lt;span class=&quot;sn&quot;&gt;${i+1}&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;ti&quot;&gt;${c===&quot;todo&quot; ? &quot;　&quot; : st.ti}${sw}&lt;/div&gt;&lt;div class=&quot;say&quot;&gt;${st.say}&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;`;
  }).join(&quot;&quot;);
  $(&quot;tip&quot;).innerHTML = `&lt;span&gt;提醒&lt;/span&gt;${L.tip}`;
  const done = step &gt;= total;
  $(&quot;ans&quot;).className = &quot;anscard&quot; + (done ? &quot;&quot; : &quot; wait&quot;);

// ---------- 逐段摘要 ----------
const $ = id =&gt; document.getElementById(id);
let cur = 0, step = 0;
function arr(x){ return Array.isArray(x) ? x : [x]; }
function buildChips(){
  $(&quot;chips&quot;).innerHTML = P.map((p,i)=&gt;`&lt;button class=&quot;chip&quot; type=&quot;button&quot; data-i=&quot;${i}&quot; aria-pressed=&quot;${i===cur}&quot;&gt;第${p.cn}段&lt;small&gt;${p.role}&lt;/small&gt;&lt;/button&gt;`).join(&quot;&quot;);
  $(&quot;chips&quot;).querySelectorAll(&quot;.chip&quot;).forEach(b=&gt;b.onclick=()=&gt;{cur=+b.dataset.i;step=0;render();});
}
const psubs = p =&gt; p.steps.flatMap((st,si)=&gt;[{si, ph:&quot;ask&quot;}, {si, ph:&quot;show&quot;}]);
function render(){
  const p = P[cur], SB = psubs(p), total = SB.length + 1;
  document.querySelectorAll(&quot;#chips .chip&quot;).forEach((b,i)=&gt;b.setAttribute(&quot;aria-pressed&quot;, i===cur));
  $(&quot;pn&quot;).textContent = `第${p.cn}段`;
  $(&quot;prole&quot;).textContent = p.role;
  $(&quot;pstrat&quot;).innerHTML = p.st.map(s=&gt;`&lt;span class=&quot;sp ${s}&quot;&gt;${s}&lt;/span&gt;`).join(&quot;&quot;);
  const state = {}, tags = {}, shown = new Set();
  SB.slice(0, Math.min(step, SB.length)).forEach((sb, j) =&gt; {
    if (sb.ph !== &quot;show&quot;) return;
    shown.add(sb.si);
    (p.steps[sb.si].do||[]).forEach(([kind, ids, label]) =&gt; {
      const list = arr(ids);
      list.forEach(id =&gt; state[id] = {kind, fresh: j === step-1});
      if (label) tags[list[list.length-1]] = {kind, label, fresh: j === step-1};
    });
  });
  const finalStep = step &gt;= total;
  $(&quot;passage&quot;).innerHTML = p.segs.map(([id, txt]) =&gt; {
    const s = state[id];
    let cls = &quot;s&quot;;
    if (s) cls += &quot; &quot; + s.kind + (s.fresh ? &quot; pre focus&quot; : &quot;&quot;);
    else if (finalStep) cls += &quot; dim&quot;;
    const tg = tags[id] ? `&lt;span class=&quot;tag ${tags[id].kind}&quot;&gt;${tags[id].kind===&quot;grp&quot; ? &quot;→ &quot; : &quot;&quot;}${tags[id].label}&lt;/span&gt;` : &quot;&quot;;
    return `&lt;span class=&quot;${cls}&quot; data-id=&quot;${id}&quot;&gt;${txt}&lt;/span&gt;${tg}`;
  }).join(&quot;&quot;);
  requestAnimationFrame(()=&gt;requestAnimationFrame(()=&gt;{
    document.querySelectorAll(&quot;#passage .s.pre&quot;).forEach(el=&gt;el.classList.remove(&quot;pre&quot;));
  }));
  const curSi = step === 0 ? -1 : step &gt; SB.length ? p.steps.length : SB[step-1].si;
  shown.add(p.steps.length);
  const all = p.steps.concat([{ti:&quot;寫成一句&quot;, say:&quot;把留下的重點用自己的話串成一句完整的話。&quot;}]);
  $(&quot;steps&quot;).innerHTML = all.map((st,i)=&gt;{
    const c = i &lt; curSi ? &quot;done&quot; : i === curSi ? &quot;cur&quot; : &quot;todo&quot;;
    const kinds = [...new Set((st.do||[]).map(d=&gt;d[0]))];
    const col = {topic:&quot;var(--gold)&quot;, key:&quot;var(--brick)&quot;, del:&quot;var(--strike)&quot;, grp:&quot;var(--sage)&quot;}[kinds[0]] || &quot;var(--deep2)&quot;;
    const sws = (c===&quot;todo&quot; || !shown.has(i)) ? &quot;&quot; : kinds.map(k=&gt;`&lt;span class=&quot;sw ${k}&quot;&gt;&lt;/span&gt;`).join(&quot;&quot;);
    const say = shown.has(i) ? st.say : &quot;先想一想，回課文找找看。&quot;;
    return `&lt;li class=&quot;${c}${shown.has(i) ? &quot;&quot; : &quot; asking&quot;}&quot; style=&quot;--c:${col}&quot;&gt;&lt;span class=&quot;no&quot;&gt;${i+1}&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;ti&quot;&gt;${c===&quot;todo&quot; ? &quot;　&quot; : st.ti}${sws}&lt;/div&gt;&lt;div class=&quot;say&quot;&gt;${say}&lt;/div&gt;&lt;/div&gt;&lt;/li&gt;`;
  }).join(&quot;&quot;);
  $(&quot;sum&quot;).classList.toggle(&quot;wait&quot;, !finalStep);
  $(&quot;sumtx&quot;).textContent = finalStep ? p.sum : (step === 0 ? &quot;先讀一遍原文，想想這一段在講什麼。準備好就按「開始」。&quot; : &quot;還在找重點……&quot;);
  $(&quot;why&quot;).hidden = !finalStep;
  $(&quot;why&quot;).textContent = &quot;為什麼這樣摘：&quot; + p.why;
  $(&quot;prev&quot;).disabled = step === 0;
  $(&quot;next&quot;).disabled = finalStep;
  const nx = SB[step];
  $(&quot;next&quot;).textContent = step === 0 ? &quot;開始&quot; : !nx ? &quot;寫成一句&quot; : nx.ph === &quot;show&quot; ? &quot;標出課文&quot; : &quot;下一步&quot;;
}
$(&quot;next&quot;).onclick = ()=&gt;{ if (step &lt; psubs(P[cur]).length + 1) { step++; render(); } };
$(&quot;prev&quot;).onclick = ()=&gt;{ if (step &gt; 0) { step--; render(); } };
$(&quot;reset&quot;).onclick = ()=&gt;{ step = 0; render(); };

let sstep = 0, segBuilt = false;

OUT.forEach((o,oi)=&gt;o.subs.forEach(k=&gt;INNERS.push({k, r:SUB[k].r || [k], oi})));

INNERS.forEach((it,ii)=&gt;SEGS.push({cap:`再細看少年時期：${ROLE[it.k]}｜${SUB[it.k].t}（${rng(it.r)}）`, say:&quot;第三、四段寫發生的事件；第五段停下來說明什麼是真正的勇敢。&quot;, show:[&quot;i&quot;+ii]}));
const frame = rx =&gt; `&lt;svg class=&quot;frame&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;0&quot; y=&quot;0&quot; width=&quot;100%&quot; height=&quot;100%&quot; rx=&quot;${rx}&quot; pathLength=&quot;100&quot;/&gt;&lt;/svg&gt;`;
const row2 = n =&gt; `&lt;div class=&quot;pbox&quot;&gt;&lt;div class=&quot;pt&quot;&gt;${P[n-1].cn}&lt;/div&gt;&lt;div class=&quot;ps&quot;&gt;${P[n-1].sum}&lt;/div&gt;&lt;/div&gt;`;
const xp = (id, html) =&gt; `&lt;div class=&quot;xp&quot; data-for=&quot;${id}&quot;&gt;&lt;div&gt;${html}&lt;/div&gt;&lt;/div&gt;`;
function buildSeg(){
  let ii = 0;
  $(&quot;pboxes&quot;).innerHTML = `&lt;div class=&quot;seg2&quot;&gt;` + OUT.map((o,oi)=&gt;{
    const inner = o.subs.length ? o.subs.map(k=&gt;{
      const id = &quot;i&quot;+(ii++), sb = SUB[k], rr = sb.r || [k];
      return `&lt;div class=&quot;ibox&quot; data-id=&quot;${id}&quot;&gt;${frame(12)}${xp(id, `&lt;div class=&quot;ilab&quot;&gt;&lt;span class=&quot;it&quot;&gt;${ROLE[k]}｜${sb.t}&lt;/span&gt;&lt;span class=&quot;ir&quot;&gt;${rng(rr)}&lt;/span&gt;&lt;/div&gt;`)}${rr.map(row2).join(&quot;&quot;)}${rr.length&gt;1 ? xp(id, `&lt;div class=&quot;osum&quot;&gt;&lt;b&gt;大意&lt;/b&gt;${sb.tx}&lt;/div&gt;`) : &quot;&quot;}&lt;/div&gt;`;
    }).join(&quot;&quot;) : o.r.map(row2).join(&quot;&quot;);
    return `&lt;div class=&quot;obox ${o.c}&quot; data-id=&quot;o${oi}&quot;&gt;${frame(16)}&lt;div class=&quot;olab&quot;&gt;&lt;div class=&quot;ot&quot;&gt;${o.t}&lt;/div&gt;&lt;div class=&quot;or&quot;&gt;${rng(o.r)}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;oin&quot;&gt;${inner}${o.r.length&gt;1 ? xp(&quot;o&quot;+oi, `&lt;div class=&quot;osum outer&quot;&gt;&lt;b&gt;大意&lt;/b&gt;${o.tx}&lt;/div&gt;`) : &quot;&quot;}&lt;/div&gt;&lt;/div&gt;`;
  }).join(&quot;&quot;) + `&lt;/div&gt;`;

function renderSeg(){
  if (!segBuilt) buildSeg();
  const st = SEGS[sstep];
  $(&quot;segcap&quot;).textContent = st.cap; $(&quot;segsay&quot;).textContent = st.say;

$(&quot;sprev&quot;).onclick=()=&gt;{ if(sstep&gt;0){sstep--;renderSeg();} };

// ---------- 全文大意 ----------
const FULL = &quot;馬拉拉因為父親的緣故，得以上學接受教育。二○○八年，恐怖組織霸占馬拉拉的家鄉。二○○九年，馬拉拉透過網路讓世界了解恐怖組織的暴行。二○一二年，恐怖組織對馬拉拉開槍，康復後的她更努力為女孩爭取受教權。二○一三年馬拉拉受邀在聯合國大會演講，震撼了所有人。二○一四年馬拉拉獲得諾貝爾和平獎，是有史以來最年輕的得主。在馬拉拉心中，就算害怕，也要站出來為沒機會學習的女孩發聲，為信念前進，這才是真正的勇敢。&quot;;
const MAIN = &quot;馬拉拉心中就算害怕，也要站出來為沒機會學習的女孩爭取受教權，這才是真正的勇敢。&quot;;
const F_STEPS = [

  {cap:&quot;第三層：串成全文大意&quot;, say:&quot;把三個時期的大事，依年分串成一段話。&quot;},
  {cap:&quot;最後：主旨&quot;, say:&quot;作者寫馬拉拉的故事，想告訴我們什麼是真正的勇敢？&quot;},

let fstep = 0;
function renderFull(){

  const rows = [
    `&lt;div class=&quot;stair&quot; style=&quot;background:var(--card)&quot;&gt;&lt;span class=&quot;big&quot; style=&quot;color:var(--brick)&quot;&gt;5&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;lb2&quot;&gt;句　自然段重點&lt;/div&gt;&lt;div class=&quot;d&quot;&gt;${P.map(p=&gt;&quot;第&quot;+p.cn+&quot;段：&quot;+p.role).join(&quot;／&quot;)}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`,
    `&lt;div class=&quot;stair&quot; style=&quot;background:var(--hl);width:min(100%,82%)&quot;&gt;&lt;span class=&quot;big&quot; style=&quot;color:var(--brick)&quot;&gt;3&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;lb2&quot;&gt;句　時期大意&lt;/div&gt;&lt;div class=&quot;d&quot;&gt;${OUT.map(o=&gt;o.t+&quot;（&quot;+rng(o.r)+&quot;）&quot;).join(&quot;／&quot;)}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`,
    `&lt;div class=&quot;full&quot;&gt;&lt;div class=&quot;lb2&quot; style=&quot;font-weight:700;color:var(--brick);margin-bottom:6px&quot;&gt;1 段　全文大意&lt;/div&gt;&lt;p&gt;${FULL}&lt;/p&gt;&lt;/div&gt;`,
    `&lt;div class=&quot;full&quot; style=&quot;background:var(--deep);border-color:var(--deep)&quot;&gt;&lt;div class=&quot;lb2&quot; style=&quot;font-weight:700;color:var(--onDeepMuted);margin-bottom:6px&quot;&gt;主旨&lt;/div&gt;&lt;p style=&quot;color:var(--onDeep)&quot;&gt;${MAIN}&lt;/p&gt;&lt;/div&gt;`,

  $(&quot;stairs&quot;).innerHTML = rows.slice(0, fstep+1).join(&quot;&quot;);

function mmMark(text, marks){
  const sp=[]; marks.forEach(m=&gt;{const i=text.indexOf(m.sub); if(i&lt;0) return; if(sp.some(s=&gt;i&lt;s.e&amp;&amp;i+m.sub.length&gt;s.s)) return; sp.push({s:i,e:i+m.sub.length,m});});
  sp.sort((a,b)=&gt;a.s-b.s); let o=&quot;&quot;,p=0;
  sp.forEach(({s,e,m})=&gt;{o+=text.slice(p,s)+`&lt;span class=&quot;mmk ${m.c}${m.fresh?&quot; pre fresh&quot;:&quot;&quot;}&quot;&gt;${text.slice(s,e)}&lt;/span&gt;`;p=e;});
  return o+text.slice(p);
}

/* 標記 */
.s{transition:color .45s ease,opacity .45s ease,background-size .6s ease,box-shadow .35s ease;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;background-repeat:no-repeat;border-radius:4px}
.s.topic{box-shadow:0 0 0 2.5px var(--gold);background-color:var(--gold-lt);padding:0 2px}
.s.key{background-image:linear-gradient(var(--hl),var(--hl));background-size:100% 100%;font-weight:700;color:var(--brick)}
.s.key.pre{background-size:0% 100%}
.s.del{color:var(--faint);background-image:linear-gradient(var(--strike),var(--strike));background-position:0 58%;background-size:100% 2.5px}
.s.del.pre{background-size:0% 2.5px}
.s.grp{color:var(--sage);font-weight:700;background-image:linear-gradient(var(--sage),var(--sage));background-position:0 100%;background-size:100% 3px}
.s.grp.pre{background-size:0% 3px}
.s.dim{color:var(--faint)}
.s.focus{animation:pulse 1.2s ease 1}
@keyframes pulse{0%{opacity:.35}100%{opacity:1}}
.tag{font-family:var(--ui);font-size:13px;font-weight:700;vertical-align:.45em;margin:0 3px;padding:1px 8px;border-radius:999px;
  white-space:nowrap;letter-spacing:0;line-height:1.5;display:inline-block;animation:pop .35s ease}
.tag.del{background:var(--strike);color:#fff}
.tag.grp{background:var(--sage);color:#fff}
.tag.topic{background:var(--gold);color:#fff}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.s,.tag{transition:none;animation:none}}

.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--card);border-radius:var(--r);padding:18px}
.panel h2{margin:0 0 10px;font-size:15px;color:var(--muted);letter-spacing:.06em}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;color:var(--faint)}
.steps .no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:15px;
  background:var(--line);color:var(--muted)}
.steps li.done{color:var(--muted)}
.steps li.done .no{background:var(--deep2);color:#fff}
.steps li.cur{color:var(--fg)}
.steps li.cur .no{background:var(--brick);color:#fff}
ol.steps li.done .no,ol.steps li.cur .no{background:var(--c);color:#fff}
ol.steps li.done .ti,ol.steps li.cur .ti{color:var(--c)}
ol.steps .sw{width:24px;height:13px;margin-left:8px;vertical-align:0}
ol.steps .sw.del{background:linear-gradient(var(--strike),var(--strike)) 0 55%/100% 2.5px no-repeat}
ol.steps li.asking .say{color:var(--faint);font-style:italic}
.steps .ti{font-weight:700;font-size:16px;line-height:1.4}
.steps .say{font-size:15px;line-height:1.55;margin-top:2px}
.steps li.todo .say{display:none}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;font:700 17px var(--ui);padding:12px 18px;cursor:pointer}
.btn.next{background:var(--brick);color:#fff;flex:1 1 140px}
.btn.prev,.btn.reset{background:var(--paper);color:var(--fg);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.hint{font-size:13px;color:var(--muted)}
kbd{font-family:var(--ui);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--paper)}

.sum{background:var(--deep);color:var(--onDeep);border-radius:var(--r);padding:18px 22px;display:flex;gap:14px;align-items:center;
  min-height:84px;transition:opacity .4s ease}
.sum .lb{flex:none;background:var(--brick);color:#fff;font-weight:700;font-size:14px;padding:4px 12px;border-radius:999px}
.sum .tx{font-size:clamp(19px,2vw,25px);font-weight:700;line-height:1.5;min-width:0}
.sum.wait .tx{color:var(--onDeepMuted);font-weight:500;font-size:17px}
.why{font-size:15px;color:var(--muted);margin-top:-6px}

/* 意義段 */
.seg-wrap{display:flex;flex-direction:column;gap:16px}
.paras{display:flex;flex-direction:column;gap:6px}
.pbox{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:8px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;transition:background .4s,border-color .4s}
.pbox .pt{font-weight:900;font-size:18px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--deep2);color:#fff}
.pa{display:inline-block;font-family:var(--ui);font-size:12px;font-weight:700;color:#fff;background:var(--deep2);border-radius:999px;padding:1px 8px;margin-right:8px;vertical-align:3px}
.olab .ot{font-size:20px!important;letter-spacing:.02em!important}
.pbox .ps{font-family:var(--text);font-size:clamp(17px,1.7vw,22px);line-height:1.5;color:var(--fg)}
.groups{display:grid;gap:10px}
.obox{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;border:3px solid var(--oc);border-radius:16px;padding:10px;background:var(--paper);animation:pop .35s ease}
.o-gold{--oc:var(--gold)} .o-brick{--oc:var(--brick)}
.olab{background:var(--oc);color:#fff;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 4px;text-align:center}
.olab .ot{font-size:24px;font-weight:900;letter-spacing:.1em}
.olab .or{font-size:13px;opacity:.9}
.oin{display:flex;flex-direction:column;gap:8px;min-width:0}
.ibox{border:2.5px dashed var(--sage);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--sage-lt);animation:pop .35s ease}
.ilab{display:flex;gap:10px;align-items:baseline;padding:0 4px}
.ilab .it{font-weight:900;font-size:18px;color:var(--sage)}
.ilab .ir{font-size:13px;color:var(--muted)}
.osum{font-family:var(--text);font-size:clamp(16px,1.6vw,20px);line-height:1.55;padding:6px 8px;border-radius:8px;background:var(--card)}
.osum b{font-family:var(--ui);font-size:13px;color:#fff;background:var(--deep2);padding:2px 10px;border-radius:999px;margin-right:8px;vertical-align:2px}
.obox .pbox{border-width:1px}
@media (max-width:640px){.obox{grid-template-columns:minmax(0,1fr)}.olab{flex-direction:row;gap:10px;padding:6px}}
.g{border-radius:12px;padding:12px 16px;display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:6px 16px;align-items:center;animation:pop .35s ease}
@media (max-width:640px){.g{grid-template-columns:minmax(0,1fr)}}
.g .gt{font-weight:900;font-size:20px}
.g .gr{font-size:13px;opacity:.85}
.g .gx{font-family:var(--text);font-size:clamp(17px,1.7vw,21px);line-height:1.6}
.g.r0{background:var(--deep);color:var(--onDeep)}
.g.r1{background:var(--card);color:var(--fg)}
.g.r1 .gt{color:var(--brick)}
.full{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,2.4vw,30px)}
.full p{font-family:var(--text);font-size:clamp(20px,2.1vw,27px);line-height:2;margin:0}
.stairs{display:flex;flex-direction:column;gap:10px}
.stair{display:flex;gap:14px;align-items:center;border-radius:12px;padding:12px 18px;animation:pop .35s ease}
.stair .big{font-size:38px;font-weight:900;line-height:1;min-width:46px}
.stair .lb2{font-weight:700;font-size:18px}
.stair .d{font-size:14px;color:var(--muted)}
.view[hidden]{display:none!important}
.howgrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:18px;align-items:start}
@media (max-width:900px){.howgrid{grid-template-columns:minmax(0,1fr)}}
.howm{display:flex;flex-direction:column;gap:10px}
.howtitle{font-size:22px;font-weight:900}
.howtitle small{display:block;font-size:15px;font-weight:500;color:var(--muted);margin-top:2px}
.hk{--hc:var(--brick);--hl:var(--hl)} .hd{--hc:var(--strike);--hl:var(--card)} .hg{--hc:var(--sage);--hl:var(--sage-lt)} .hs{--hc:var(--deep2);--hl:var(--card)}
.hcard{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;align-items:start;border-radius:14px;padding:12px 14px;background:var(--hl);border:2px solid transparent;transition:opacity .4s}
.hcard.cur{border-color:var(--hc)}
.hcard.off{background:transparent;border:2px dashed var(--line)}
.hcard.off .hno{background:var(--line)}
.hno{width:42px;height:42px;border-radius:50%;background:var(--hc);color:#fff;font-weight:900;font-size:20px;display:grid;place-items:center}
.ht{font-size:22px;font-weight:900;color:var(--hc);line-height:1.3}
.hcard.off .ht{color:var(--faint)}
.hcard li.warn{list-style:none;margin-left:-1.2em;color:var(--brick);font-weight:700}
.hcard li.warn::before{content:&quot;⚠ &quot;}
.hcard li small{color:var(--muted);font-size:14px}
.hcard ul{margin:4px 0 0;padding-left:1.2em;font-size:16px;line-height:1.6}
.howex{display:flex;flex-direction:column;gap:12px;min-width:0}
.howp{font-family:var(--text);font-size:clamp(20px,2vw,26px);line-height:2;margin:6px 0 0;text-align:justify}
.hm{border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hm.xk{background:var(--hl);color:var(--brick);font-weight:700}
.hm.xd{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--strike);text-decoration-thickness:2.5px}
.hm.xg{color:var(--sage);font-weight:700;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.hm.dim{color:var(--faint)}
.hm.fr{animation:pulse 1s ease 1}
.hpill{display:inline-block;background:var(--hc);color:#fff;border-radius:999px;padding:2px 12px;margin-right:8px;font-size:.9em}
.seg2{display:flex;flex-direction:column;gap:14px}
.seg2 .obox{border:0;background:transparent;animation:none;position:relative}
.seg2 .ibox{border:0;background:transparent;animation:none;position:relative;transition:background .5s ease .7s}
.seg2 .ibox.on{background:var(--sage-lt)}
.frame{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.frame rect{fill:none;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1.1s ease}
.on&gt;.frame rect{stroke-dashoffset:0}
.obox&gt;.frame rect{stroke:var(--oc);stroke-width:3.5}
.ibox&gt;.frame rect{stroke:var(--sage);stroke-width:2.5}
.seg2 .olab{opacity:0;transition:opacity .5s ease .8s;width:110px;align-self:stretch}
.seg2 .obox.on&gt;.olab{opacity:1}
.xp{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .5s ease .6s,opacity .4s ease .9s}
.xp&gt;div{overflow:hidden;min-height:0}
.xp.open{grid-template-rows:1fr;opacity:1}
.osum.outer{background:var(--paper);border:1.5px dashed var(--line)}
@media (prefers-reduced-motion:reduce){.frame rect,.xp,.seg2 .olab,.seg2 .ibox{transition:none}}
.segstage{position:relative;padding:22px 340px 22px 150px}
.segrows{display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.segrows .pbox.gap-in{margin-top:16px}
.segrows .pbox.gap-out{margin-top:40px}
.segsvg{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:visible}
.segsvg rect{fill:none}
.segsvg .obx{stroke-width:3.5}
.segsvg .obx.o-brick{stroke:var(--brick)} .segsvg .obx.o-gold{stroke:var(--gold)}
.segsvg .ibx{stroke:var(--sage);stroke-width:2.5}
.olab2{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:12px;color:#fff;text-align:center;padding:6px}
.olab2.o-brick{background:var(--brick)} .olab2.o-gold{background:var(--gold)}
.olab2 .ot{font-size:20px;font-weight:900;line-height:1.25}
.olab2 .or{font-size:12px;opacity:.9}
#segnotes{position:absolute;top:0;right:0;width:320px;z-index:1}
.snote{position:absolute;left:0;right:0;background:var(--card);border-radius:10px;padding:8px 12px;font-family:var(--text);font-size:clamp(15px,1.3vw,17px);line-height:1.55}
.snote b{font-family:var(--ui);font-size:12px;color:#fff;background:var(--deep2);border-radius:999px;padding:1px 9px;margin-right:6px;vertical-align:2px}
.snote.o-brick{box-shadow:inset 3px 0 0 0 transparent}
.snote .nt{display:block;font-family:var(--ui);font-weight:900;font-size:15px;color:var(--sage)}
.snote .nt small{font-weight:500;color:var(--muted);margin-left:6px;font-size:12px}
.segstage .rv{animation:fadein .5s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (max-width:900px){.segstage{padding:22px 16px 22px 110px}#segnotes{display:none}}
@media (prefers-reduced-motion:reduce){.segsvg rect{transition:none!important;stroke-dasharray:none!important}}
.m1{--mc:#B07A1E;--mlt:#F6E9CF} .m2{--mc:#2F72A8;--mlt:#DCE8F4} .m3{--mc:#7B4FA0;--mlt:#EADFF2} .m4{--mc:#5E8C7B;--mlt:#DCE8E2}
.rwstage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.rwstage{grid-template-columns:minmax(0,1fr)}}
.rwside{display:flex;flex-direction:column;gap:12px;min-width:0;position:sticky;top:10px}
.rwpass p{font-family:var(--text);font-size:clamp(17px,1.55vw,20px);line-height:1.85;margin:0 0 8px;display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px}
.guide{background:var(--gold-lt);border:1.5px solid var(--gold);border-radius:12px;padding:12px 14px}
.guide&gt;b{display:inline-block;font-size:12px;color:#fff;background:var(--gold);border-radius:999px;padding:1px 10px;margin-bottom:4px}
.guide p{margin:0;font-size:16px;line-height:1.6}
.rwflow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.rwflow i{font-style:normal;color:var(--muted)}
.rwk2{background:var(--mc);color:#fff;font-weight:900;border-radius:8px;padding:4px 12px}
.rwhead{font-size:20px;font-weight:900}
.rwhead span{font-size:14px;font-weight:500;color:var(--muted);margin-left:6px}
.rwgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:860px){.rwgrid{grid-template-columns:minmax(0,1fr)}}
.rwt{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rwh{font-weight:900;font-size:19px}
.rwr{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;align-items:stretch}
.rwk{background:var(--mc);color:#fff;font-weight:900;border-radius:8px;display:grid;place-items:center;font-size:17px;padding:8px 0}
.rwv{background:var(--mlt);color:var(--fg);border-radius:8px;padding:8px 12px;font-family:var(--text);font-size:clamp(18px,1.7vw,22px);line-height:1.5}
.rwv.blank,.rwview.blank{background:transparent;border:2px dashed var(--line);color:var(--faint)}
.rwv.write{min-height:48px}
.rwview{background:var(--deep);color:var(--onDeep);border-radius:10px;padding:10px 14px;font-family:var(--text);font-size:clamp(18px,1.7vw,22px);line-height:1.55}
.rwview b{font-family:var(--ui);font-size:13px;background:var(--brick);color:#fff;border-radius:999px;padding:2px 10px;margin-right:8px;vertical-align:2px}
.rwview.write{min-height:96px;color:var(--muted)}
.rwview.write b{background:var(--deep2)}
.rwq p{margin:0;font-family:var(--text);font-size:clamp(17px,1.6vw,20px);line-height:1.6}
.rwq p b{font-family:var(--ui);color:var(--brick);margin-right:6px}
.rwq .ex{font-family:var(--ui);font-size:15px;color:var(--muted)}
.rwq ol{margin:0;padding-left:1.4em;font-family:var(--text);font-size:clamp(16px,1.5vw,19px);line-height:1.6}
.stairs .rv{animation:fadeup2 .5s ease both}
@keyframes fadeup2{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.capk{display:inline-block;background:var(--mc);color:#fff;border-radius:999px;padding:2px 12px;margin:0 8px 0 2px;font-size:.95em}
.capq{color:var(--mc)}
.k1{--mc:var(--brick);--mlt:#F0DCD5} .k2{--mc:#7B4FA0;--mlt:#EADFF2} .k3{--mc:#5E8C7B;--mlt:#DCE8E2} .k4{--mc:#B07A1E;--mlt:#F6E9CF} .k5{--mc:#5C2018;--mlt:#EFE3DE}
.mmgrid{display:grid;grid-template-columns:minmax(0,1fr);align-items:start}
.mmgrid&gt;#mpass,.mmgrid&gt;.mmap{grid-area:1/1}

.mmgrid&gt;.mmap{justify-self:end;width:56%;position:sticky;top:10px;z-index:3;box-shadow:0 10px 30px rgba(60,30,20,.18),0 0 0 1px var(--line);background:color-mix(in srgb, var(--paper) 78%, transparent);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.mmgrid.mhide&gt;.mmap{display:none}

@media (max-width:900px){.mmgrid&gt;#mpass,.mmgrid&gt;.mmap{grid-area:auto}.mmgrid&gt;.mmap{width:100%;position:static;box-shadow:none;margin-top:12px}}
#mpass p{font-family:var(--text);font-size:clamp(17px,1.55vw,20px);line-height:1.85;margin:0 0 8px;display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px}
.mpn{font-family:var(--ui);font-size:13px;font-weight:700;color:var(--muted);padding-top:4px}
.mpt{font-weight:900;font-size:19px;margin-bottom:6px}
.mmk{color:var(--mc);font-weight:700;background-image:linear-gradient(var(--mlt),var(--mlt));background-repeat:no-repeat;background-size:100% 100%;border-radius:4px;transition:background-size .6s ease;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.mmk.pre{background-size:0% 100%}
.mmk.fresh{animation:pulse 1s ease 1}
.mmap{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;min-width:0}
.mroot{background:#E07B39;color:#fff;font-weight:900;font-size:17px;border-radius:50%;padding:18px 14px;text-align:center;line-height:1.3;width:96px;box-shadow:0 0 0 3px var(--paper),0 0 0 5px #9C9C9C}
.mbrs{display:flex;flex-direction:column;gap:14px;border-left:4px solid var(--line);padding-left:12px;min-width:0}
.mbranch{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
.mart{font-weight:900;font-size:16px;background:#DCEBD3;border:2px solid #9AB98A;border-radius:6px;padding:6px 10px;white-space:nowrap}
.mbranch.b0 .mart{border-color:#A85A5A}
.mnodes{display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--line);padding-left:10px;min-width:0}
.mnode{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.mnode.ghost .mn{color:var(--faint);border:2px dashed var(--line);background:transparent}
.mn{font-weight:900;font-size:15px;color:#fff;background:var(--mc);border-radius:999px;padding:3px 12px;white-space:nowrap}
.mleaves{display:flex;flex-direction:column;gap:4px;border-left:2px solid var(--mc);padding-left:8px}
.lf{font-size:15px;font-weight:700;color:var(--mc);background:var(--mlt);border-radius:6px;padding:2px 10px;white-space:nowrap}
.mpair{display:flex;gap:6px;align-items:center}
.arr{color:var(--muted)}
.mbr{font-size:15px;font-weight:900;color:var(--mc);border:2px solid var(--mc);border-radius:6px;padding:3px 10px;position:relative;margin-left:4px;white-space:nowrap}
.mbr::before{content:&quot;}&quot;;position:absolute;left:-14px;top:50%;transform:translateY(-55%);font-size:30px;font-weight:300;color:var(--mc)}
@media (max-width:640px){.mmap{grid-template-columns:minmax(0,1fr)}.mbranch{grid-template-columns:minmax(0,1fr)}}
.o-purple{--oc:#7B4FA0}
.mart.m1,.mart.m2,.mart.m3,.mart.m4{background:var(--mlt);border-color:var(--mc);color:var(--mc)}
.mart.ghost{color:var(--faint);border:2px dashed var(--line);background:transparent}
.mrow{display:flex;flex-wrap:nowrap;gap:6px;align-items:center}
.mrow&gt;.mn,.mrow&gt;.arr{flex:none}
.mrow .mleaves{min-width:0}
.mrow .mleaves{flex-direction:row;flex-wrap:wrap;border-left:0;padding-left:0}
.mroot{font-size:15px;width:104px}
/* 形式深究 */

const MT = {a4:&quot;二○一三年，馬拉拉受邀在聯合國大會上演講。她說：「恐怖分子認為他們的暴行能夠改變我的決心，但是對我來說，這些壓迫讓我失去的只是軟弱、害怕和無望，得到的則是堅強、勇氣和希望。」她還說：「讓我們拾起書本和筆，那是最強大的武器。一個孩子、一位老師、一本書和一枝筆，就可以改變這個世界。」這段話震撼了所有人，她也因此被稱為「全世界最勇敢的女孩」。她和父親成立了馬拉拉基金會，以實際的行動幫助窮困的女孩上學。二○一四年，十七歲的馬拉拉得到諾貝爾和平獎，是有史以來最年輕的得主。&quot;,
  a5:&quot;展現出無比勇氣的馬拉拉，用生命保衛女性受教育的權利，也讓人思索：什麼是「勇敢」？沒有恐懼，不害怕就是勇敢嗎？不知道害怕，有可能是無知造成的。馬拉拉縱使心中害怕，卻還是願意為信念前進。她心裡可能會因為險惡的環境和被槍擊的經驗而有所恐懼，但是心中有一個要為女孩爭取受教權的目標。因此，就算害怕，她也要站出來為沒機會學習的女孩發聲，這才是真正的勇敢。&quot;};

  way: [{t:&quot;way&quot;}, {t:&quot;flower&quot;,ph:0}, {t:&quot;flower&quot;,ph:1}, {t:&quot;onion&quot;,ph:0}, {t:&quot;onion&quot;,ph:1}, {t:&quot;onion&quot;,ph:2}, {t:&quot;gold&quot;}],
  hw:  [{t:&quot;hw&quot;,i:-1}, {t:&quot;hw&quot;,i:0}, {t:&quot;hw&quot;,i:1}, {t:&quot;hw&quot;,i:2}, {t:&quot;hw&quot;,i:3}],
  wr:  [{t:&quot;w&quot;,k:0}, {t:&quot;w&quot;,k:1}, {t:&quot;w&quot;,k:2}, {t:&quot;w&quot;,k:3}, {t:&quot;w&quot;,k:4}],
};
const pos = {rw:0, way:0, hw:0, wr:0};
function show(v){
  const L = VIEWS[v], S = L[pos[v]], {cap, say, out} = charOut(S);
  $(v+&quot;cap&quot;).innerHTML = cap; $(v+&quot;say&quot;).textContent = say; $(v+&quot;box&quot;).innerHTML = out;
  unpre(&quot;#&quot;+v+&quot;box&quot;);
  $(v+&quot;prev&quot;).disabled = pos[v]===0; $(v+&quot;next&quot;).disabled = pos[v]===L.length-1;
  const nx = L[pos[v]+1];
  $(v+&quot;next&quot;).textContent = !nx ? &quot;完成&quot; : (nx.ph===&quot;fill&quot;) ? &quot;填進表格&quot; : (nx.t===&quot;cmp&quot; &amp;&amp; nx.ph===&quot;show&quot;) ? &quot;看提醒&quot; : (nx.t===&quot;hw&quot;) ? &quot;下一題&quot; : &quot;下一步&quot;;
}
Object.keys(VIEWS).forEach(v=&gt;{
  $(v+&quot;next&quot;).onclick=()=&gt;{ if(pos[v]&lt;VIEWS[v].length-1){pos[v]++;show(v);} };
  $(v+&quot;prev&quot;).onclick=()=&gt;{ if(pos[v]&gt;0){pos[v]--;show(v);} };
  show(v);
});
let view = &quot;rw&quot;;
document.querySelectorAll(&quot;.tabs button&quot;).forEach(b=&gt;b.onclick=()=&gt;{
  view = b.dataset.view.slice(2);
  document.querySelectorAll(&quot;.tabs button&quot;).forEach(x=&gt;x.setAttribute(&quot;aria-selected&quot;, x===b));
  document.querySelectorAll(&quot;.view&quot;).forEach(x=&gt;x.hidden = x.id!==&quot;v-&quot;+view);
});
document.addEventListener(&quot;keydown&quot;, e=&gt;{
  if (e.key===&quot;ArrowRight&quot; || e.key===&quot; &quot; || e.key===&quot;PageDown&quot;){ e.preventDefault(); $(view+&quot;next&quot;).click(); }
  else if (e.key===&quot;ArrowLeft&quot; || e.key===&quot;PageUp&quot;){ e.preventDefault(); $(view+&quot;prev&quot;).click(); }
});
&lt;/script&gt;&lt;style&gt;header&gt;div:first-child{display:none}header{justify-content:flex-end}.wrap{padding-block:12px 40px}.controls .btn.prev,.controls .btn.next{display:none!important}&lt;/style&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
</div>
<script>
const SECS = {"l7": [["l7-f1", "第三節　課文深究"], ["l7-f2", "補充節　摘要與分段"]], "l8": [["l8-f1", "第三節　課文深究"], ["l8-f2", "補充節　摘要與分段"], ["l8-f3", "第五節　寫作教學"]]};
const $ = id => document.getElementById(id);
let lesson = "l8", cur = null;
const lastSec = {};
function load(f){ if (f.dataset.src){ f.srcdoc = f.dataset.src; f.removeAttribute("data-src"); } }
function pickSec(id){
  cur = id; lastSec[lesson] = id;
  const f = $(id); load(f);
  document.querySelectorAll("iframe").forEach(x=>x.hidden = x.id!==id);
  document.querySelectorAll("#sw button").forEach(b=>b.setAttribute("aria-selected", b.dataset.f===id));
  try{ f.contentWindow.focus(); }catch(e){}
}
function pickLesson(l){
  lesson = l; $("lesson").value = l;
  $("sw").innerHTML = SECS[l].map(([id,t])=>`<button role="tab" type="button" data-f="${id}">${t}</button>`).join("");
  $("sw").querySelectorAll("button").forEach(b=>b.onclick=()=>pickSec(b.dataset.f));
  document.title = $("lesson").selectedOptions[0].textContent + "　教學網頁";
  pickSec(lastSec[l] || SECS[l][0][0]);
  try{ localStorage.setItem("lesson", l); }catch(e){}
}
$("lesson").onchange = e=>pickLesson(e.target.value);
function innerBtn(kind){
  try{
    const d = $(cur).contentDocument;
    const v = [...d.querySelectorAll(".view")].find(x=>!x.hidden);
    return v ? v.querySelector(".controls .btn." + kind) : null;
  }catch(e){ return null; }
}
function syncNav(){
  const n = innerBtn("next"), p = innerBtn("prev");
  $("gnext").textContent = n ? n.textContent : "下一步";
  $("gnext").disabled = !n || n.disabled; $("gprev").disabled = !p || p.disabled;
}
$("gnext").onclick = ()=>{ const b = innerBtn("next"); if (b && !b.disabled) b.click(); syncNav(); };
$("gprev").onclick = ()=>{ const b = innerBtn("prev"); if (b && !b.disabled) b.click(); syncNav(); };
setInterval(syncNav, 250);
document.addEventListener("keydown", e=>{
  if (e.target.tagName==="SELECT") return;
  if (!["ArrowRight","ArrowLeft"," ","PageDown","PageUp"].includes(e.key) && !/^[1-8]$/.test(e.key)) return;
  try{ const d = $(cur).contentDocument; e.preventDefault(); d.dispatchEvent(new KeyboardEvent("keydown", {key:e.key, bubbles:true})); }catch(err){}
});
let start = "l8"; try{ const s = localStorage.getItem("lesson"); if (SECS[s]) start = s; }catch(e){}
pickLesson(start);
</script>
</body></html>
